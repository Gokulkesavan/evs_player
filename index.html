<!-- ========== NEW: EVS → PCM ========== -->
<div class="container" style="padding-top:0">
  <div class="divider"></div>
  <section id="evsToPcmSection">
    <h2>EVS → Raw PCM (S16LE) <span class="badge">Direct Converter</span></h2>
    <div class="card">
      <div class="hint" style="margin-bottom:10px">
        Upload an EVS MIME storage file (<code>#!EVS_MC1.0</code> …) to decode it to raw
        <strong>S16LE</strong> PCM using the in‑browser WASM decoder.
      </div>

      <!-- Drop zone -->
      <div id="evsDropZone" style="border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;background:#0d141c">
        <div style="color:var(--muted);font-size:13px">
          Drop a <code>.evs</code> file here, or
          <button class="btn small" type="button" id="evsPickBtn">browse…</button>
        </div>
        <input type="file" id="evsFileInput" accept=".evs" hidden>
        <div id="evsInfo" style="margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted)">
          (expects EVS MIME storage format)
        </div>
      </div>

      <!-- Output sample rate (must match the original EVS stream) -->
      <div class="inline-fields" style="margin-top:14px">
        <div>
          <label class="lbl" for="evsRate">Output sample rate (Hz)</label>
          <select id="evsRate">
            <option value="8000">8000</option>
            <option value="16000" selected>16000</option>
            <option value="32000">32000</option>
            <option value="48000">48000</option>
          </select>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="btnrow" style="margin-top:14px">
        <button class="btn ok" id="evsConvertBtn" type="button" disabled>Convert to PCM</button>
        <span id="evsStatus" class="hint"></span>
      </div>

      <!-- Player / download container -->
      <div id="evsPlayerContainer" style="margin-top:12px"></div>
    </div>
  </section>
</div>
<!-- ========== END NEW ========== -->
